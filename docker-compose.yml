version: '3.8'

services:
  web:
    build: .
    container_name: radiology_platform_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql+aiomysql://radiology_user:radiology_pass@db:3306/radiology_db
      - REDIS_URL=redis://redis:6379/0
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_ID=${ADMIN_ID}
      - SECRET_KEY=${SECRET_KEY}
      - IS_INSTALLED=${IS_INSTALLED}
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: radiology_platform_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: radiology_db
      MYSQL_USER: radiology_user
      MYSQL_PASSWORD: radiology_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: radiology_platform_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
